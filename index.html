<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#9ed8ff" />
  <title>Gyro Archery</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="ergonomics.css" />
</head>
<body>
  <main id="app" class="hold-right">
    <canvas id="game"></canvas>

    <section id="hud" aria-label="ゲーム情報">
      <div class="hud-card"><span>プレイヤー</span><strong id="playerHud">P1/1</strong></div>
      <div class="hud-card"><span>スコア</span><strong id="score">0</strong></div>
      <div class="hud-card"><span>残り</span><strong id="arrows">5</strong></div>
      <div class="hud-card distance"><span>距離</span><strong id="distanceHud">25m</strong></div>
      <div class="hud-card power"><span>引き</span><strong id="powerText">0%</strong><div class="power-track"><i id="powerFill"></i></div></div>
      <div class="hud-card combo" id="comboCard"><span>コンボ</span><strong id="combo">×1</strong></div>
      <div class="hud-card wind"><span>風</span><strong id="wind">0.0 m/s →</strong></div>
    </section>

    <div id="reticle" aria-hidden="true"><i></i><b></b></div>
    <div id="message" role="status" aria-live="polite"></div>
    <div id="bullseyeFx" aria-hidden="true"><span>BULLSEYE!</span></div>

    <aside id="handPreview" aria-label="手認識プレビュー">
      <video id="handVideo" autoplay muted playsinline></video>
      <canvas id="handOverlay"></canvas>
      <div id="handStatus">カメラ準備中</div>
    </aside>

    <section id="startPanel" class="panel">
      <div class="panel-inner">
        <div class="logo">🏹</div>
        <h1>GYRO ARCHERY</h1>
        <p>スマホを交代で持って、最大4人でアーチェリー対戦。</p>

        <div class="setup-grid">
          <label>
            <span>人数</span>
            <select id="playerCount">
              <option value="1">1人</option>
              <option value="2">2人</option>
              <option value="3">3人</option>
              <option value="4">4人</option>
            </select>
          </label>
          <label>
            <span>距離</span>
            <select id="distanceSelect">
              <option value="10">10m</option>
              <option value="18">18m</option>
              <option value="25" selected>25m</option>
              <option value="35">35m</option>
            </select>
          </label>

          <fieldset class="hold-hand-field">
            <legend>スマホを持つ手</legend>
            <div class="hold-hand-options">
              <input id="phoneHandLeft" type="radio" name="phoneHand" value="left" />
              <label for="phoneHandLeft">🤚 左手持ち</label>
              <input id="phoneHandRight" type="radio" name="phoneHand" value="right" checked />
              <label for="phoneHandRight">右手持ち ✋</label>
            </div>
            <span class="hold-hand-note">操作ボタンは持つ手側、手認識プレビューは反対側に移動します。</span>
          </fieldset>
        </div>

        <button id="startBtn" type="button">ジャイロ＋手認識で開始</button>
        <button id="mouseBtn" class="secondary" type="button">カメラなしで試す</button>
        <small>1人5射。🤏で弦をつまみ、引いたあと指を開くと発射。画面タップでも撃てます。1射ごとに交代し、風向きと風速も変化します。</small>
      </div>
    </section>

    <section id="turnPanel" class="turn-panel" aria-live="polite">
      <div class="turn-card">
        <div class="turn-kicker">PASS THE PHONE</div>
        <h2 id="turnTitle">P1 の番</h2>
        <p id="turnMeta">25m ・ 5射残り</p>
        <button id="turnReadyBtn" type="button">準備OK</button>
      </div>
    </section>

    <section id="resultPanel" class="result-panel" aria-live="polite">
      <div class="result-inner">
        <div class="result-kicker">MATCH COMPLETE</div>
        <h2>RESULT</h2>
        <div id="resultList" class="result-list"></div>
        <button id="restartBtn" type="button">同じ設定でもう一度</button>
      </div>
    </section>

    <div class="bottom-controls">
      <button id="handCalibrateBtn" type="button">手の基準</button>
      <button id="calibrateBtn" type="button">照準リセット</button>
    </div>
    <button id="soundBtn" class="floating sound" type="button">♪</button>
  </main>

  <script type="module" src="ergonomics.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
