<!doctype html>
<html lang="ja">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9ed8ff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",system-ui,sans-serif;user-select:none}#app{position:relative;width:100%;height:100%;min-height:100dvh;overflow:hidden}#game{width:100%;height:100%;display:block}.hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;z-index:4;display:flex;gap:7px;pointer-events:none}.card{min-width:68px;padding:7px 10px;border-radius:15px;background:#ffffffe6;box-shadow:0 4px 14px #0002;backdrop-filter:blur(8px)}.card span{display:block;font-size:10px;color:#52616b}.card b{font-size:18px;color:#17232b}.wind{margin-left:auto}.power{min-width:100px}.track{height:6px;margin-top:4px;border-radius:9px;background:#0002;overflow:hidden}.track i{display:block;width:0;height:100%;background:#e39b1f}.reticle{--s:1;position:absolute;z-index:3;left:50%;top:50%;width:58px;height:58px;transform:translate(-50%,-50%) scale(var(--s));pointer-events:none}.reticle:before,.reticle:after{content:"";position:absolute;background:#1d282e}.reticle:before{left:28px;width:2px;height:58px}.reticle:after{top:28px;width:58px;height:2px}.reticle i{position:absolute;inset:12px;border:2px solid #1d282e;border-radius:50%}.reticle.full{filter:drop-shadow(0 0 7px #fff)}#msg{position:absolute;z-index:7;top:24%;left:50%;transform:translateX(-50%);font-size:clamp(28px,8vw,54px);font-weight:900;color:white;text-shadow:0 3px 12px #0008;opacity:0;transition:.18s;white-space:nowrap}#msg.show{opacity:1;transform:translate(-50%,-8px) scale(1.05)}#preview{display:none;position:absolute;z-index:5;right:12px;top:80px;width:112px;aspect-ratio:4/3;border:2px solid #fffd;border-radius:16px;overflow:hidden;background:#18232b}#preview.on{display:block}#video,#overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#video{transform:scaleX(-1)}#handState{position:absolute;left:4px; </head>
<body><main id="app"><canvas id="game"></canvas><div class="focus" id="focus"></div>
<div class="hud"><div class="card"><span>スコア</span><b id="score">0</b></div><div class="card"><span>矢</span><b id="arrows">10</b></div><div class="card power"><span>引き</span><b id="power">0%</b><div class="track"><i id="fill"></i></div></div><div class="card"><span>コンボ</span><b id="combo">×1</b></div><div class="card wind"><span>風</span><b id="wind">0.0 →</b></div></div>
<div class="reticle" id="reticle"><i></i></div><div id="msg"></div><div class="bull" id="bull"><span>BULLSEYE!</span></div>
<aside id="preview"><video id="video" autoplay muted playsinline></video><canvas id="overlay"></canvas><div id="handState">カメラ準備中</div></aside>
<section class="panel" id="panel"><div class="box"><div class="logo">🏹</div><h1>GYRO ARCHERY</h1><p>スマホを動かして狙い、空いている手を引いてパワーをため、画面タップで発射。</p><button id="start">ジャイロ＋手認識で開始</button><button id="demo">カメラなしで試す</button><small>iPhoneではモーションとカメラの許可が必要です。</small></div></section>
<section class="result" id="result"><div class="box"><div>10 ARROWS COMPLETE</div><h2>RESULT</h2><div class="resultScore" id="rScore">0</div><div class="grid"><div><span>平均</span><b id="rAvg">0</b></div><div><span>最高</span><b id="rBest">0</b></div><div><span>10点</span><b id="rTen">0</b></div><div><span>最高コンボ</span><b id="rCombo">0</b></div></div><button id="again">もう一度</button></div></section>
<div class="controls"><button id="handCal">手の基準</button><button id="gyroCal">照準リセット</button></div><button id="sound">♪</button></main>
<script type="module">

const $=s=>document.querySelector(s),ui={score:$('#score'),arrows:$('#arrows'),power:$('#power'),fill:$('#fill'),combo:$('#combo'),wind:$('#wind'),reticle:$('#reticle'),focus:$('#focus'),msg:$('#msg'),bull:$('#bull'),panel:$('#panel'),result:$('#result'),video:$('#video'),preview:$('#preview'),overlay:$('#overlay'),handState:$('#handState')};
const renderer=new THREE.WebGLRenderer({canvas:$('#game'),antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;const scene=new THREE.Scene();scene.background=new THREE.Color(0xa8dcff);scene.fog=new THREE.Fog(0xa8dcff,42,95);const camera=new THREE.PerspectiveCamera(58,1,.1,150);camera.position.set(0,1.65,4.5);scene.add(camera);scene.add(new THREE.HemisphereLight(0xffffff,0x4c6c38,2.2));const sun=new THREE.DirectionalLight(0xffffff,2.4);sun.position.set(-8,14,8);sun.castShadow=true;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(130,130),new THREE.MeshStandardMaterial({color:0x72ad52}));ground.rotation.x=-Math.PI/2;scene.add(ground);const lane=new THREE.Mesh(new THREE.PlaneGeometry(7,42),new THREE.MeshStandardMaterial({color:0xcaa873}));lane.rotation.x=-Math.PI/2;lane.position.set(0,.012,-17);scene.add(lane);
function tree(x,z,s=1){const tr=new THREE.Mesh(new THREE.CylinderGeometry(.18*s,.25*s,1.9*s,8),new THREE.MeshStandardMaterial({color:0x765035}));tr.position.set(x,.95*s,z);scene.add(tr);const cr=new THREE.Mesh(new THREE.ConeGeometry(1.1*s,2.8*s,9),new THREE.MeshStandardMaterial({color:0x3b8647}));cr.position.set(x,2.7*s,z);scene.add(cr)}for(let z=-4;z>-66;z-=6){tree(-7,z,.9);tree(7,z,.9)}
const TZ=-25,target=new THREE.Group();target.position.set(0,2.2,TZ);scene.add(target);[[1.65,0xf5f2df],[1.35,0x20242a],[1.08,0x2785c6],[.80,0xd73c38],[.52,0xf0c52c],[.20,0xf6d13e]].forEach(([r,c],i)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,.12,64),new THREE.MeshStandardMaterial({color:c}));m.rotation.x=Math.PI/2;m.position.z=i*.011;target.add(m)});for(const x of[-.75,.75]){const l=new THREE.Mesh(new THREE.BoxGeometry(.18,2.4,.18),new THREE.MeshStandardMaterial({color:0x7d5738}));l.position.set(x,-1.55,.2);l.rotation.z=x<0?-.12:.12;target.add(l)}
const flag=new THREE.Group();flag.position.set(-3.4,0,-12);scene.add(flag);const pole=new THREE.Mesh(new THREE.CylinderGeometry(.035,.045,3.25,10),new THREE.MeshStandardMaterial({color:0xd6d9d8}));pole.position.y=1.62;flag.add(pole);const fg=new THREE.PlaneGeometry(1.45,.72,8,2);fg.translate(.72,0,0);const base=Float32Array.from(fg.attributes.position.array),fm=new THREE.Mesh(fg,new THREE.MeshStandardMaterial({color:0xf4f0dc,side:THREE.DoubleSide}));fm.position.y=2.62;flag.add(fm);
const bow=new THREE.Group(),bm=new THREE.MeshStandardMaterial({color:0x8a4f27});for(const[y,r]of[[.58,-.18],[-.58,.18]]){const m=new THREE.Mesh(new THREE.BoxGeometry(.08,1.15,.07),bm);m.position.y=y;m.rotation.z=r;bow.add(m)}const sg=new THREE.BufferGeometry();const sp=new Float32Array([-.12,1.14,0,.18,0,0,-.12,-1.14,0]);sg.setAttribute('position',new THREE.BufferAttribute(sp,3));bow.add(new THREE.Line(sg,new THREE.LineBasicMaterial({color:0xe9e0ca})));bow.position.set(-.72,-.55,-1.75);bow.scale.setScalar(.72);camera.add(bow);
let running=false,gyro=false,handMode=false,baseA=0,baseB=0,raw={a:0,b:0},yaw=0,pitch=0,ty=0,tp=0,score=0,left=10,wind=0,combo=0,bestCombo=0,shots=[],draw=0,drawT=0,baseline=null,hand=false,landmarker=null,lastVideo=-1,lastInfer=0,cin=null,soundOn=true,hold=0,kick=0;const arrows=[];const home=new THREE.Vector3(0,1.65,4.5),euler=new THREE.Euler(0,0,0,'YXZ'),q=new THREE.Quaternion();
let ac=null,bgm=null,bgmStep=0;const notes=[261.63,329.63,392,523.25,392,329.63,293.66,369.99,440,587.33,440,369.99];function ctx(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}function tone(f,d=.15,v=.08,type='sine',delay=0){if(!soundOn)return;const c=ctx(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.type=type;g.gain.setValueAtTime(v,c.currentTime+delay);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+delay+d);o.connect(g);g.connect(c.destination);o.start(c.currentTime+delay);o.stop(c.currentTime+delay+d+.02)}function shootS(){tone(155,.22,.2,'triangle');tone(235,.15,.1,'sine',.01)}function hitS(){tone(88,.18,.18)}function scoreS(){tone(880,.23,.09);tone(1320,.28,.06,'sine',.05)}function bgmOn(){if(bgm||!soundOn)return;bgm=setInterval(()=>{if(running){const f=notes[bgmStep++%notes.length];tone(f,.28,.025,'triangle')}},500)}function bgmOff(){clearInterval(bgm);bgm=null}
function msg(t,ms=800){ui.msg.textContent=t;ui.msg.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(()=>ui.msg.classList.remove('show'),ms)}function calibrate(){baseA=raw.a;baseB=raw.b;ty=tp=yaw=pitch=0;msg('AIM RESET',550)}window.addEventListener('deviceorientation',e=>{raw.a=(e.alpha||0)*Math.PI/180;raw.b=(e.beta||0)*Math.PI/180;if(gyro){let d=raw.a-baseA;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;ty=THREE.MathUtils.clamp(-d*1.3,-1.1,1.1);tp=THREE.MathUtils.clamp(-(raw.b-baseB)*.95,-.7,.7)}});
async function initHand(){try{const v=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm');landmarker=await HandLandmarker.createFromOptions(v,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'},runningMode:'VIDEO',numHands:1,minHandDetectionConfidence:.45,minTrackingConfidence:.45});const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});ui.video.srcObject=stream;await ui.video.play();ui.preview.classList.add('on');handMode=true;ui.handState.textContent='手を映してください'}catch(e){handMode=false;msg('カメラなしで開始',900)}}
function sample(lm){const wrist=lm[0],idx=lm[5],pink=lm[17],mid=lm[9],cx=(wrist.x+idx.x+pink.x+mid.x)/4,cy=(wrist.y+idx.y+pink.y+mid.y)/4,size=Math.hypot(idx.x-pink.x,idx.y-pink.y);return{x:1-cx,y:cy,size}}function updateHand(now){if(!handMode||!landmarker||ui.video.readyState<2)return;if(ui.video.currentTime===lastVideo||now-lastInfer<45)return;lastVideo=ui.video.currentTime;lastInfer=now;const r=landmarker.detectForVideo(ui.video,now);hand=!!r.landmarks?.length;ui.handState.textContent=hand?(baseline?'手認識中':'「手の基準」を押す'):'手を映してください';if(hand){const s=sample(r.landmarks[0]);if(baseline){const dx=Math.abs(s.x-.5)-Math.abs(baseline.x-.5),size=Math.max(0,(baseline.size-s.size)/Math.max(.01,baseline.size)),vert=Math.abs(s.y-baseline.y);drawT=THREE.MathUtils.clamp(dx*3.0+size*.45-vert*.15,0,1)}else drawT=0;const c=ui.overlay.getContext('2d');ui.overlay.width=ui.video.videoWidth;ui.overlay.height=ui.video.videoHeight;c.clearRect(0,0,c.canvas.width,c.canvas.height);c.fillStyle='#61ff9b';for(const p of r.landmarks[0]){c.beginPath();c.arc((1-p.x)*c.canvas.width,p.y*c.canvas.height,3,0,Math.PI*2);c.fill()}}else drawT*=.96}
function arrowMesh(){const g=new THREE.Group(),shaft=new THREE.Mesh(new THREE.CylinderGeometry(.018,.018,1.35,10),new THREE.MeshStandardMaterial({color:0x6f492c}));shaft.rotation.x=Math.PI/2;g.add(shaft);const tip=new THREE.Mesh(new THREE.ConeGeometry(.06,.18,8),new THREE.MeshStandardMaterial({color:0x555b5f}));tip.rotation.x=-Math.PI/2;tip.position.z=-.77;g.add(tip);return g}function fire(){if(!running||left<=0||cin)return;left--;ui.arrows.textContent=left;shootS();kick=1;if(navigator.vibrate)navigator.vibrate(22);const m=arrowMesh();m.position.copy(camera.position);camera.getWorldDirection(new THREE.Vector3()).normalize();const dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion).normalize(),speed=14+draw*19,vel=dir.multiplyScalar(speed);m.position.addScaledVector(dir,1.25);scene.add(m);const a={m,vel,life:0,scored:false};arrows.push(a);cin={phase:'launch',t:0,a};drawT=0}
function points(x,y){const r=Math.hypot(x,y);return r<=.2?10:r<=.52?9:r<=.8?8:r<=1.08?6:r<=1.35?4:r<=1.65?2:0}function addScore(p){shots.push(p);score+=p;ui.score.textContent=score;if(p>=8){combo++;bestCombo=Math.max(bestCombo,combo)}else combo=0;ui.combo.textContent='×'+Math.max(1,combo);if(p===10){ui.bull.classList.remove('show');void ui.bull.offsetWidth;ui.bull.classList.add('show');scoreS();if(navigator.vibrate)navigator.vibrate([30,25,45]);msg('10 BULLSEYE!',1000)}else msg(p?p+' POINT!':'MISS',800)}

const clock=new THREE.Clock();function animate(now=performance.now()){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.033);yaw+=(ty-yaw)*(1-Math.exp(-9*dt));pitch+=(tp-pitch)*(1-Math.exp(-9*dt));updateHand(now);draw+=(drawT-draw)*(1-Math.exp(-10*dt));const pct=Math.round(draw*100);ui.power.textContent=pct+'%';ui.fill.style.width=pct+'%';if(draw>.86&&!cin)hold+=dt;else hold=Math.max(0,hold-dt*3);const z=THREE.MathUtils.smoothstep(draw,.28,1);if(!cin){camera.position.copy(home);kick=Math.max(0,kick-dt*7);const strain=THREE.MathUtils.clamp((hold-1.5)/2.5,0,1),tYaw=(Math.sin(now*.021)+Math.sin(now*.037)*.55)*.0065*strain,tPitch=(Math.sin(now*.026+1.2)+Math.sin(now*.043)*.45)*.0055*strain;euler.set(pitch+tPitch-Math.sin((1-kick)*Math.PI)*.018*kick,yaw+tYaw,0);camera.quaternion.setFromEuler(euler);camera.fov+=(THREE.MathUtils.lerp(58,36,z)-camera.fov)*.1;camera.updateProjectionMatrix()}ui.reticle.style.setProperty('--s',(1-.38*z).toFixed(3));ui.reticle.classList.toggle('full',draw>.86);ui.focus.style.opacity=(z*.16).toFixed(3);const a=fg.attributes.position.array,st=THREE.MathUtils.clamp(wind/2,-1,1);for(let i=0;i<a.length;i+=3){const x0=base[i],t=THREE.MathUtils.clamp(x0/1.45,0,1);a[i]=x0;a[i+1]=base[i+1]+Math.sin(now*.006+t*5.5)*.055*t*Math.abs(st);a[i+2]=st*.24*t}fg.attributes.position.needsUpdate=true;fm.rotation.y=-st*.38;const phys=cin?.phase==='impact'?dt*.18:dt;updateArrows(phys);if(cin){cin.t+=dt;if(cin.phase==='launch'&&cin.t>.2){cin.phase='follow';cin.t=0}else if(cin.phase==='follow'&&cin.a?.m?.parent){const d=cin.a.vel.clone().normalize(),des=cin.a.m.position.clone().addScaledVector(d,-2.2).add(new THREE.Vector3(0,.4,0));camera.position.lerp(des,1-Math.exp(-12*dt));camera.lookAt(cin.a.m.position.clone().addScaledVector(d,5));camera.fov+=(48-camera.fov)*.12;camera.updateProjectionMatrix()}else if(cin.phase==='impact'){const des=cin.a.m.position.clone().add(new THREE.Vector3(.55,.35,2.1));camera.position.lerp(des,1-Math.exp(-10*dt));camera.loo
