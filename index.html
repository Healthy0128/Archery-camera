<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#9ed8ff" />
  <title>Gyro Archery</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">
    <canvas id="game"></canvas>

    <section id="hud" aria-label="ゲーム情報">
      <div class="hud-card"><span>スコア</span><strong id="score">0</strong></div>
      <div class="hud-card"><span>矢</span><strong id="arrows">10</strong></div>
      <div class="hud-card power"><span>引き</span><strong id="powerText">0%</strong><div class="power-track"><i id="powerFill"></i></div></div>
      <div class="hud-card combo" id="comboCard"><span>コンボ</span><strong id="combo">×1</strong></div>
      <div class="hud-card wind"><span>風</span><strong id="wind">0.0 m/s →</strong></div>
    </section>

    <div id="reticle" aria-hidden="true"><i></i><b></b></div>
    <div id="message" role="status" aria-live="polite"></div>
    <div id="bullseyeFx" aria-hidden="true"><span>BULLSEYE!</span></div>

    <aside id="handPreview" aria-label="手認識プレビュー">
      <video id="handVideo" autoplay muted playsinline></video>
      <canvas id="handOverlay"></canvas>
      <div id="handStatus">カメラ準備中</div>
    </aside>

    <section id="startPanel" class="panel">
      <div class="panel-inner">
        <div class="logo">🏹</div>
        <h1>GYRO ARCHERY</h1>
        <p>スマホを動かして狙い、空いている手を引いてパワーをため、画面タップで矢を放とう。</p>
        <button id="startBtn" type="button">ジャイロ＋手認識で開始</button>
        <button id="mouseBtn" class="secondary" type="button">カメラなしで試す</button>
        <small>開始時に「モーションと方向」と「カメラ」の許可が必要です。インカメラ映像は端末内で手認識に使います。</small>
      </div>
    </section>

    <section id="resultPanel" class="result-panel" aria-live="polite">
      <div class="result-inner">
        <div class="result-kicker">10 ARROWS COMPLETE</div>
        <h2>RESULT</h2>
        <div class="result-score"><span>合計</span><strong id="resultScore">0</strong><small> / 100</small></div>
        <div class="result-grid">
          <div><span>平均</span><b id="resultAvg">0.0</b></div>
          <div><span>最高</span><b id="resultBest">0</b></div>
          <div><span>10点</span><b id="resultTens">0</b></div>
          <div><span>最高コンボ</span><b id="resultCombo">0</b></div>
        </div>
        <button id="restartBtn" type="button">もう一度</button>
      </div>
    </section>

    <div class="bottom-controls">
      <button id="handCalibrateBtn" type="button">手の基準</button>
      <button id="calibrateBtn" type="button">照準リセット</button>
    </div>
    <button id="soundBtn" class="floating sound" type="button">♪</button>
  </main>

  <script type="module" src="gyro-fix.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
